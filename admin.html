<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Toro Finance Group — Administration</title>
  <style>
    :root{--navy:#111a2f;--gold:#c99a3b;--bg:#f3f5f8;--card:#fff;--muted:#6d7484;--line:#e4e7ed;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}
    header strong{font-size:18px;letter-spacing:.5px}header span{color:#d9b35c;font-size:12px;display:block;margin-top:3px}
    button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.gold{background:var(--gold);color:#fff}.dark{background:var(--navy);color:#fff}.light{background:#eef1f6;color:var(--navy)}
    main{max-width:1200px;margin:0 auto;padding:25px 18px 50px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(15,25,45,.05)}
    form{max-width:420px;margin:50px auto}h1{margin:0 0 7px;font-size:28px}.muted{color:var(--muted)}.hidden{display:none!important}
    .field{margin:0 0 14px}label{display:block;font-weight:700;margin:0 0 7px}input,select{width:100%;padding:13px 14px;border:1px solid #d6dae2;border-radius:10px;background:#fff;font-size:16px;color:var(--navy)}
    .error{color:var(--danger);font-weight:700;margin-top:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar input{max-width:360px}.count{margin-left:auto;color:var(--muted);font-size:14px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#fafbfc}tr:last-child td{border-bottom:0}
    .ref{font-weight:800}.amount{font-weight:800}.contact a{color:var(--navy);text-decoration:none}.status{min-width:180px}.status-msg{margin-top:12px;font-weight:700}.ok{color:#087443}.bad{color:var(--danger)}.loading{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:650px){header{padding:15px}main{padding:18px 12px}.panel{padding:16px}h1{font-size:24px}.count{width:100%;margin-left:0}}
  </style>
</head>
<body>
  <header>
    <div><strong>TORO FINANCE GROUP</strong><span>ADMINISTRATION</span></div>
    <button id="logoutButton" class="light hidden">Déconnexion</button>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <form id="loginForm">
        <h1>Administration</h1>
        <p class="muted">Connectez-vous pour consulter et traiter les demandes reçues.</p>
        <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="gold" type="submit">Se connecter</button>
        <div id="loginError" class="error"></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="panel" style="margin-bottom:18px">
        <h1>Demandes de financement</h1>
        <p class="muted">Consultez les dossiers reçus et mettez à jour leur statut. Les modifications sont enregistrées dans Supabase.</p>
      </div>
      <div class="panel">
        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="Rechercher une référence, un nom, un e-mail…">
          <select id="statusFilter">
            <option value="">Tous les statuts</option>
            <option value="pending">En attente</option>
            <option value="reviewing">En étude</option>
            <option value="more_info">Informations complémentaires</option>
            <option value="approved">Approuvé</option>
            <option value="rejected">Refusé</option>
          </select>
          <button id="refreshButton" class="dark">Actualiser</button>
          <span id="count" class="count"></span>
        </div>
        <div id="tableArea" class="table-wrap"><div class="loading">Chargement…</div></div>
        <div id="saveMessage" class="status-msg"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
