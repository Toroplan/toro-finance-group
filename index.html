<form id="demoForm"
      action="https://formsubmit.co/petrasbarisas08@gmail.com"
      method="POST"
      target="formSubmitFrame">

  <input type="hidden" name="_subject"
         value="Nouvelle pré-demande — Toro Finance Group">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="true">
  <input type="hidden" name="reference" id="emailReference">

  <div class="form-grid">
    <label>
      <span>Prénom</span>
      <input required name="firstName" autocomplete="given-name">
    </label>

    <label>
      <span>Nom</span>
      <input required name="lastName" autocomplete="family-name">
    </label>
  </div>

  <label>
    <span>E-mail</span>
    <input required type="email" name="email"
           autocomplete="email"
           placeholder="votre@email.com">
  </label>

  <div class="form-grid">
    <label>
      <span>Pays</span>
      <select name="country">
        <option>France</option>
        <option>Belgique</option>
        <option>Allemagne</option>
        <option>Italie</option>
        <option>Lituanie</option>
        <option>Espagne</option>
        <option>Portugal</option>
        <option>Autre</option>
      </select>
    </label>

    <label>
      <span>Financement</span>
      <select name="product">
        <option>Prêt personnel</option>
        <option>Professionnel</option>
        <option>Immobilier</option>
        <option>Automobile</option>
        <option>Projet / investissement</option>
      </select>
    </label>
  </div>

  <label>
    <span>Montant souhaité</span>
    <input id="amount" required type="number"
           min="1" step="1" name="amount"
           inputmode="numeric" placeholder="Ex. 10000">
  </label>

  <label class="check">
    <input required type="checkbox" name="consent">
    <span>J'accepte que ces informations soient utilisées pour traiter cette pré-demande.</span>
  </label>

  <button class="button" type="submit">
    Envoyer la pré-demande
  </button>

  <p id="result" class="result" aria-live="polite"></p>

  <a id="whatsappButton"
     class="button secondary"
     href="#"
     target="_blank"
     rel="noopener"
     hidden>
    Envoyer aussi sur WhatsApp
  </a>

  <iframe name="formSubmitFrame"
          title="Transmission de la demande"
          hidden></iframe>
</form>
<button class="button" type="submit">
  Envoyer la pré-demande
</button>
